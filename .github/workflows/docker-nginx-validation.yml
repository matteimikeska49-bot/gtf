name: Docker Nginx Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "prerender.mjs"
      - ".github/workflows/docker-nginx-validation.yml"

  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/docker-nginx-validation.yml"

  workflow_dispatch:

concurrency:
  group: docker-nginx-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-nginx-validation:
    name: Build Docker image and validate nginx
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show changed context
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          ls -la
          test -f Dockerfile
          test -f nginx.conf

      - name: Build production Docker image
        run: |
          docker build -t gotoflow-nginx-validation:${{ github.sha }} .

      - name: Validate nginx config inside image
        run: |
          docker run --rm --entrypoint nginx gotoflow-nginx-validation:${{ github.sha }} -t

      - name: Start container for smoke test
        run: |
          docker run -d --name gotoflow-nginx-smoke -p 8080:80 gotoflow-nginx-validation:${{ github.sha }}
          sleep 5

      - name: Smoke test root page
        run: |
          curl -sSI http://localhost:8080/
          curl -fsSI http://localhost:8080/

      - name: Smoke test RU page
        run: |
          curl -sSI http://localhost:8080/ru
          curl -fsSI http://localhost:8080/ru

      - name: Smoke test logo asset
        run: |
          curl -sSI http://localhost:8080/images/logo.png
          curl -fsSI http://localhost:8080/images/logo.png

      - name: Smoke test RU browser root redirect
        run: |
          curl -sSI -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.8" http://localhost:8080/ | tr -d '\r' | tee /tmp/ru-root-headers.txt
          grep -Ei "^HTTP/.* 302" /tmp/ru-root-headers.txt
          grep -Ei "^location: /ru($|[?])" /tmp/ru-root-headers.txt

      - name: Smoke test RU redirect preserves query string
        run: |
          curl -sSI -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.8" "http://localhost:8080/?utm_source=smoke" | tr -d '\r' | tee /tmp/ru-root-query-headers.txt
          grep -Ei "^HTTP/.* 302" /tmp/ru-root-query-headers.txt
          grep -Ei "^location: /ru[?]utm_source=smoke" /tmp/ru-root-query-headers.txt

      - name: Smoke test EN browser root stays 200
        run: |
          curl -sSI -H "Accept-Language: en-US,en;q=0.9" http://localhost:8080/ | tr -d '\r' | tee /tmp/en-root-headers.txt
          grep -Ei "^HTTP/.* 200" /tmp/en-root-headers.txt

      - name: Smoke test bot is not redirected
        run: |
          curl -sSI -A "Googlebot/2.1 (+http://www.google.com/bot.html)" -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.8" http://localhost:8080/ | tr -d '\r' | tee /tmp/bot-root-headers.txt
          grep -Ei "^HTTP/.* 200" /tmp/bot-root-headers.txt

      - name: Smoke test manual English cookie is not redirected
        run: |
          curl -sSI -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.8" -H "Cookie: gtf_lang=en" http://localhost:8080/ | tr -d '\r' | tee /tmp/cookie-en-root-headers.txt
          grep -Ei "^HTTP/.* 200" /tmp/cookie-en-root-headers.txt

      - name: Smoke test lang en query is not redirected
        run: |
          curl -sSI -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.8" "http://localhost:8080/?lang=en" | tr -d '\r' | tee /tmp/lang-en-root-headers.txt
          grep -Ei "^HTTP/.* 200" /tmp/lang-en-root-headers.txt

      - name: Diagnostic SPA fallback route
        run: |
          set +e
          echo "Checking diagnostic fallback route. This step is informational only."
          curl -sSI http://localhost:8080/__spa_smoke_test__ || true

      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs gotoflow-nginx-smoke || true

      - name: Stop smoke container
        if: always()
        run: |
          docker rm -f gotoflow-nginx-smoke || true
