<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Готовая карусель GoToFlow для салона красоты</title>
  <desc id="desc">Многослайдовая карусель с обложкой, внутренними слайдами и финальным CTA без фейковых метрик.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171122"/>
      <stop offset="0.48" stop-color="#281127"/>
      <stop offset="1" stop-color="#3a1d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cardOne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cardTwo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#3b1f2f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="820" rx="44" fill="url(#bg)"/>
  <path d="M0 640C180 568 315 612 459 674C642 753 830 806 1280 662V820H0Z" fill="#050505" opacity="0.34"/>
  <circle cx="1024" cy="120" r="210" fill="#ec4899" opacity="0.10"/>
  <circle cx="178" cy="712" r="220" fill="#fb923c" opacity="0.10"/>

  <g transform="translate(72 70)">
    <rect x="0" y="0" width="1136" height="680" rx="34" fill="#08080b" opacity="0.70" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="42" y="58" fill="#f9a8d4" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">РЕДАКТОР GOTOFLOW</text>
    <text x="42" y="98" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">5 ошибок в продвижении салона красоты</text>

    <g transform="translate(42 138)">
      <rect x="0" y="0" width="142" height="56" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="34" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750">4:5</text>
      <rect x="158" y="0" width="176" height="56" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="180" y="34" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750">7 слайдов</text>
      <rect x="350" y="0" width="210" height="56" rx="16" fill="url(#accent)" fill-opacity="0.22" stroke="#ec4899" stroke-opacity="0.30"/>
      <text x="374" y="34" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Ручная правка</text>
    </g>

    <g transform="translate(42 224)">
      <g filter="url(#softShadow)">
        <rect x="0" y="0" width="282" height="376" rx="28" fill="url(#cardOne)"/>
        <text x="30" y="58" fill="#831843" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" letter-spacing="1.6">ОБЛОЖКА</text>
        <text x="30" y="126" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">5 ошибок</text>
        <text x="30" y="169" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900">в продвижении</text>
        <text x="30" y="212" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900">салона</text>
        <path d="M34 278H208" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>
        <text x="30" y="322" fill="#831843" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">разбор для владельца</text>
      </g>

      <g transform="translate(318 24)" filter="url(#softShadow)">
        <rect x="0" y="0" width="238" height="318" rx="26" fill="url(#cardTwo)"/>
        <text x="26" y="54" fill="#fb923c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850">01</text>
        <text x="26" y="102" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">Слишком общий</text>
        <text x="26" y="134" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">оффер</text>
        <text x="26" y="196" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17">Клиенту нужно сразу</text>
        <text x="26" y="222" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17">понять услугу, результат</text>
        <text x="26" y="248" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17">и следующий шаг.</text>
      </g>

      <g transform="translate(590 24)" filter="url(#softShadow)">
        <rect x="0" y="0" width="238" height="318" rx="26" fill="#f8fafc"/>
        <text x="26" y="54" fill="#ec4899" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850">03</text>
        <text x="26" y="102" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">Нет причины</text>
        <text x="26" y="134" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">сохранить пост</text>
        <rect x="26" y="182" width="186" height="14" rx="7" fill="#f9a8d4"/>
        <rect x="26" y="214" width="144" height="14" rx="7" fill="#fdba74"/>
        <rect x="26" y="246" width="172" height="14" rx="7" fill="#e4e4e7"/>
      </g>

      <g transform="translate(862 0)" filter="url(#softShadow)">
        <rect x="0" y="0" width="232" height="376" rx="28" fill="#111827"/>
        <text x="28" y="58" fill="#f9a8d4" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">CTA</text>
        <text x="28" y="124" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">Проверьте</text>
        <text x="28" y="160" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">свой профиль</text>
        <text x="28" y="220" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17">Сохраните карусель</text>
        <text x="28" y="246" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17">и отметьте, что</text>
        <text x="28" y="272" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17">стоит исправить.</text>
        <rect x="28" y="314" width="148" height="36" rx="18" fill="url(#accent)"/>
        <text x="52" y="338" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">готово</text>
      </g>
    </g>
  </g>
</svg>
