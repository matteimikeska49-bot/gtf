map $http_accept_language $gtf_wants_ru {
    default 0;
    ~*(^|,)\s*ru(-[A-Za-z]{2})?(\s*;|,|$) 1;
}

map $request_method $gtf_safe_method {
    default 0;
    GET 1;
    HEAD 1;
}

map $arg_lang $gtf_query_en {
    default 0;
    ~*^en$ 1;
}

map $cookie_gtf_lang $gtf_cookie_en {
    default 0;
    ~*^en$ 1;
}

map $http_user_agent $gtf_is_bot {
    default 0;
    ~*(googlebot|bingbot|yandexbot|duckduckbot|baiduspider|facebookexternalhit|twitterbot|linkedinbot|slurp) 1;
}

map "$gtf_safe_method:$gtf_wants_ru:$gtf_query_en:$gtf_cookie_en:$gtf_is_bot" $gtf_redirect_ru_root {
    default 0;
    "1:1:0:0:0" 1;
}

server {
    listen 80;
    server_name _;

    # Redirect /index and /index/ to /
    rewrite ^/index/?$ https://$host/ permanent;

    # Redirect old AI post maker URL to the current Instagram post generator page
    rewrite ^/ai-post-maker/?$ https://$host/ai-instagram-post-generator permanent;

    # Legacy ru tool URLs

    # Normalize multiple slashes in the URL (client-side redirect)
    if ($request_uri ~ "^[^?]*?//") {
        rewrite ^(.*)$ https://$host$1 permanent;
    }

    # Redirect trailing slashes (except root) to non-trailing slash
    rewrite ^/(.*)/$ https://$host/$1 permanent;

    root /usr/share/nginx/html;
    index index.html;

    # Default: do not cache HTML or APIs long-term, must revalidate
    add_header Cache-Control "public, max-age=0, must-revalidate";

    # Set default charset
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml text/xml;

    location = / {
        if ($gtf_redirect_ru_root) {
            return 307 /ru$is_args$args;
        }

        try_files /index.html =404;
    }

    # Serve pre-rendered static HTML per route first.
    # If not found, return 404 status but serve the SPA index.html
    # so React can visually render the NotFoundPage component.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /index.html;

    # Hashed assets from Vite (safe for immutable cache)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static unhashed images and media (shorter cache, must revalidate if changed)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|webmanifest|mp4)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Ensure correct Content-Type for HTML files
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Ensure explicit UTF-8 for text files like robots.txt and llms.txt
    location ~* \.txt$ {
        charset utf-8;
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
